# Local full stack: docker compose up --build  ->  http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eap
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eap"]
      interval: 3s
      retries: 20
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/eap
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: local-docker-secret-change-me-0123456789
    ports: ["8080:8080"]
