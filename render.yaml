# Render Blueprint: New > Blueprint > select this repo.
services:
  - type: web
    name: enterprise-analytics
    runtime: docker
    plan: free
    region: singapore            # closest Render region to India; pair with a Neon project in AWS Singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DB_URL              # jdbc:postgresql://<neon-host>/<db>?sslmode=require
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true      # Render generates a random secret
      - key: DEMO_PASSWORD
        value: demo123
