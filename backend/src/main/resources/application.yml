server:
  port: ${PORT:8080}                 # Render injects PORT
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript
  error:
    include-message: always

spring:
  application:
    name: enterprise-analytics-platform
  datasource:
    # JDBC form of the Neon connection string, e.g.
    # jdbc:postgresql://ep-xxx.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eap}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 3
      minimum-idle: 0              # let idle connections close so serverless Postgres can scale to zero
      idle-timeout: 60000
      max-lifetime: 300000
      connection-timeout: 30000    # first query after idle may wait for the DB to wake
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none               # schema is owned by Flyway migrations
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
  cache:
    type: caffeine
    cache-names: analytics
    caffeine:
      spec: maximumSize=500,expireAfterWrite=6h
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

app:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-change-me-0123456789abcdef}
    ttl-minutes: ${JWT_TTL_MINUTES:480}
  demo-password: ${DEMO_PASSWORD:demo123}
  owner:                             # private ADMIN account that may commit data changes (optional)
    username: ${OWNER_USERNAME:}
    password: ${OWNER_PASSWORD:}
  data-service:                      # Python data & AI service (Phases 2-4); empty = features disabled
    url: ${DATA_SERVICE_URL:}
    token: ${INTERNAL_API_TOKEN:}
    connect-timeout: 15s
    read-timeout: 150s
  ai:
    demo-requests-per-hour: ${AI_DEMO_REQUESTS_PER_HOUR:15}
    owner-requests-per-hour: ${AI_OWNER_REQUESTS_PER_HOUR:200}

logging:
  level:
    org.flywaydb: info
