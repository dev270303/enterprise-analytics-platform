name: Daily insights report

# Every day at 08:00 IST (02:30 UTC): refresh ML segments, build the insights report,
# store it in the database (shown on the dashboard's Insights tab) and e-mail it.
# Runs directly against the production database, so it works even while the free
# Render services are asleep. Configure the secrets listed in docs/DEPLOY.md.
on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      email:
        description: "Send the e-mail"
        type: boolean
        default: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      REPORT_RECIPIENTS: ${{ secrets.REPORT_RECIPIENTS }}
      REPORT_FROM: ${{ secrets.REPORT_FROM }}
      PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL || 'https://enterprise-analytics.onrender.com' }}
    steps:
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::DATABASE_URL secret is not set; skipping. See docs/DEPLOY.md."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.cfg.outputs.skip != 'true'
      - uses: actions/setup-python@v6
        if: steps.cfg.outputs.skip != 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: data-service/requirements.txt
      - name: Install
        if: steps.cfg.outputs.skip != 'true'
        run: pip install -r data-service/requirements.txt
      - name: Refresh customer segments (RFM + K-Means)
        if: steps.cfg.outputs.skip != 'true'
        working-directory: data-service
        run: python -m app.analysis
      - name: Build and send the insights report
        if: steps.cfg.outputs.skip != 'true'
        working-directory: data-service
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.email }}" != "true" ]; then
            python -m app.insights --trigger manual
          else
            python -m app.insights --trigger schedule --email
          fi
