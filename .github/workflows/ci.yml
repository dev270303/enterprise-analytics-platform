name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 21 · Spring Boot)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: eap
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d eap"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build, migrate and run integration tests
        working-directory: backend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/eap
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          JWT_SECRET: ci-secret-0123456789abcdef0123456789
        run: mvn -B verify 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Summarise failures as an annotation
        if: failure()
        working-directory: backend
        run: |
          {
            grep -E "^\[ERROR\]|Tests run:.*Fail|FAILURE|expected|Caused by|Exception" build.log | grep -v "^\[ERROR\] *$" | head -60
            for f in target/surefire-reports/*.txt; do grep -A6 -E "FAILURE|ERROR" "$f" | head -30; done 2>/dev/null
          } > failures.txt || true
          msg=$(head -c 20000 failures.txt | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          echo "::error title=Backend build failed::${msg}"

  data-service:
    name: Data & AI service (Python · ETL · ML · RAG)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: data-service/requirements*.txt
      - run: pip install -r data-service/requirements-dev.txt
      - name: Run tests against the real Flyway migrations
        working-directory: data-service
        env:
          TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: python -m pytest -v -p no:cacheprovider 2>&1 | tee pytest.log; exit ${PIPESTATUS[0]}
      - name: Summarise failures as an annotation
        if: failure()
        working-directory: data-service
        run: |
          msg=$(grep -E "FAILED|Error|assert" pytest.log | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
          echo "::error title=Python tests failed::${msg}"

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, data-service]
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t enterprise-analytics-backend:ci .
      - run: docker build -t enterprise-analytics-data-service:ci data-service
